<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom Family Day — Volunteer Check-In</title>
<style>
  :root {
    --navy: #1F3A5F; --ink: #2C2A22; --green: #3B7A57; --slate: #5F5A4C;
    --taupe: #8A8370; --red: #A33C3C; --sand: #B0A98F; --sandBorder: #C9BE9B;
    --border: #E6DFCE; --hairline: #EDE6D3; --track: #EFE8D6; --bg: #FAF6EE; --white: #ffffff;
  }
  * { box-sizing: border-box; }
  svg { width: 16px; height: 16px; flex-shrink: 0; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 64px; }
  .wrap.planner { padding-bottom: 112px; }
  header {
    padding: 24px 0 16px; position: sticky; top: 0; background: var(--bg);
    z-index: 20; border-bottom: 1px solid var(--border);
  }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 24px; color: var(--navy); margin: 0; }
  .subtitle { font-size: 14px; color: var(--taupe); margin-top: 2px; }
  .ver { font-size: 11px; color: var(--sand); margin-left: 8px; }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  .icon-btn { background: none; border: none; color: var(--taupe); cursor: pointer; padding: 0; display: flex; }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .link-btn {
    font-size: 12px; color: var(--taupe); text-decoration: underline; background: none;
    border: none; padding: 0; cursor: pointer; font-family: inherit;
  }
  .progress-row { margin-top: 16px; display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; background: var(--track); border-radius: 999px; height: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 999px; transition: width 0.4s ease; }
  .progress-count { font-size: 14px; font-weight: 500; color: var(--navy); white-space: nowrap; }
  .search-wrap { margin-top: 16px; position: relative; }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--taupe);
    width: 16px; height: 16px; pointer-events: none;
  }
  input[type=text], textarea {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 15px; font-family: inherit; color: var(--ink); background: var(--white);
  }
  .search-wrap input { padding-left: 36px; }
  .filters { margin-top: 12px; display: flex; gap: 8px; }
  .filter-chip {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); background: var(--white); color: var(--slate);
    cursor: pointer; font-family: inherit;
  }
  .filter-chip.active { border-color: var(--navy); background: var(--navy); color: var(--white); }
  ul.roster { margin: 12px 0 0; padding: 0; list-style: none; }
  ul.roster li { padding: 12px 0; border-top: 1px solid var(--hairline); }
  ul.roster li:first-child { border-top: none; }
  .empty-msg { padding: 40px 0; text-align: center; color: var(--sand); font-size: 14px; }
  .row { display: flex; align-items: flex-start; gap: 12px; }
  .row.tappable { cursor: pointer; padding: 6px 8px; margin: -6px -8px; border-radius: 8px; }
  .circle {
    margin-top: 2px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--sandBorder);
    background: var(--white); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .row.tappable .circle { width: 30px; height: 30px; }
  .circle.checked { border-color: var(--green); background: var(--green); }
  .circle svg { width: 14px; height: 14px; color: var(--white); }
  .row.tappable .circle svg { width: 18px; height: 18px; }
  .person-info { flex: 1; min-width: 0; }
  .person-name { font-size: 14px; font-weight: 500; margin: 0; color: var(--ink); }
  .person-name.checked { color: var(--taupe); }
  .person-assign { font-size: 12px; color: var(--taupe); margin-top: 2px; }
  .person-assign.empty { color: var(--sand); font-style: italic; }
  .edit-btn { margin-top: 2px; background: none; border: none; color: var(--sand); cursor: pointer; flex-shrink: 0; padding: 0; }
  .edit-btn svg { width: 16px; height: 16px; }
  .edit-panel { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .edit-panel label { display: block; font-size: 12px; font-weight: 500; color: var(--taupe); margin-bottom: 4px; }
  .edit-panel input, .edit-panel textarea { margin-bottom: 8px; font-size: 14px; padding: 6px 8px; }
  .warn-box { background: #FFF2CC; border: 1px solid #E8D48A; border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
  .warn-box p { font-size: 12px; color: #6B5A1E; margin: 0; }
  .edit-actions { display: flex; align-items: center; justify-content: space-between; }
  .remove-btn {
    display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--red);
    background: none; border: none; cursor: pointer; font-family: inherit; padding: 0;
  }
  .remove-btn svg { width: 14px; height: 14px; }
  .btn-group { display: flex; gap: 8px; }
  .btn-secondary {
    padding: 6px 12px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--white); color: var(--slate); cursor: pointer; font-family: inherit;
  }
  .btn-primary-sm {
    padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none;
    background: var(--navy); color: var(--white); cursor: pointer; font-family: inherit;
  }
  .btn-primary {
    display: block; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px;
    background: var(--navy); color: var(--white); font-size: 15px; font-weight: 600; border: none;
    cursor: pointer; font-family: inherit;
  }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }
  .btn-primary.with-icon { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .pin-box { margin-top: 12px; background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .pin-box-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .pin-box-head span { font-size: 14px; font-weight: 600; color: var(--navy); }
  .pin-error { font-size: 12px; color: var(--red); margin: 0 0 10px; }
  .banner { margin-top: 16px; border-radius: 8px; padding: 12px; }
  .banner.info { background: #FFF2CC; border: 1px solid #E8D48A; }
  .banner.info p { font-size: 13px; font-weight: 600; color: #6B5A1E; margin: 0 0 6px; }
  .banner.error { background: #FDEAEA; border: 1px solid #E8A8A8; }
  .banner.error p { font-size: 13px; color: #7A2C2C; margin: 0; }
  .link-row { display: flex; gap: 8px; align-items: center; }
  .link-box {
    flex: 1; font-size: 12px; color: #6B5A1E; background: var(--white); border: 1px solid #E8D48A;
    border-radius: 6px; padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .copy-btn {
    display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 6px 10px;
    border-radius: 6px; border: none; background: var(--navy); color: var(--white); cursor: pointer;
    font-family: inherit; flex-shrink: 0;
  }
  .copy-btn.copied { background: var(--green); }
  .copy-btn svg { width: 14px; height: 14px; }
  footer.add-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
    border-top: 1px solid var(--border); padding: 12px 16px;
  }
  footer.add-bar .inner { max-width: 640px; margin: 0 auto; }
  .add-panel { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .add-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .add-panel-head span { font-size: 14px; font-weight: 500; color: var(--navy); }
  .add-panel-head button { background: none; border: none; color: var(--sand); cursor: pointer; }
  .loading-wrap { min-height: 300px; display: flex; align-items: center; justify-content: center; }
  .loading-inner { display: flex; align-items: center; gap: 8px; color: var(--slate); }
  .loading-inner svg { width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
  .hidden { display: none !important; }
  .undo-row {
    margin-top: 10px; display: flex; align-items: center; justify-content: space-between;
    background: var(--track); border-radius: 6px; padding: 8px 10px;
  }
  .undo-row span { font-size: 12px; color: var(--slate); }
  .undo-row button {
    font-size: 12px; color: var(--red); background: none; border: none;
    text-decoration: underline; cursor: pointer; font-family: inherit;
  }
</style>

  roster: null,
  mode: "volunteer", // volunteer | checkin | planner
  syncing: false,
  binId: null,
  shareUrl: null,
  copied: false,
  setupError: null,
  pinPromptOpen: false,
  pinInput: "",
  pinError: "",
  listQuery: "",
  filter: "all",
  editingId: null,
  editDraft: { name: "", assignmentsText: "" },
  addOpen: false,
  addDraft: { name: "", assignmentsText: "" },
  lastAdded: null,
  isEditingSomething: false
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ===================== STORAGE (JSONBin) ===================== */
function getBinIdFromHash() {
  var m = window.location.hash.match(/bin=([a-f0-9\-]+)/i);
  return m ? m[1] : null;
}

function createBin() {
  return fetch(JSONBIN_BASE, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": JSONBIN_MASTER_KEY,
      "X-Bin-Name": "kingdom-family-day-roster"
    },
    body: JSON.stringify(SEED_ROSTER)
  }).then(function(res) {
    if (!res.ok) throw new Error("create failed: " + res.status);
    return res.json();
  }).then(function(data) {
    var newId = data.metadata.id;
    state.binId = newId;
    window.location.hash = "bin=" + newId;
    state.shareUrl = window.location.href;
    return SEED_ROSTER;
  });
}

function readBin(id) {
  return fetch(JSONBIN_BASE + "/" + id + "/latest", {
    headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
  }).then(function(res) {
    if (!res.ok) throw new Error("read failed: " + res.status);
    return res.json();
  }).then(function(data) { return data.record; });
}

function writeBin(id, value) {
  return fetch(JSONBIN_BASE + "/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_MASTER_KEY },
    body: JSON.stringify(value)
  }).then(function(res) {
    if (!res.ok) throw new Error("write failed: " + res.status);
  });
}

function loadFromStorage(isInitial) {
  state.syncing = true;
  render();
  var p;
  if (isInitial) {
    var hashId = getBinIdFromHash();
    if (hashId) {
      state.binId = hashId;
      p = readBin(hashId).then(function(record) { state.roster = record; });
    } else {
      p = createBin().then(function(record) { state.roster = record; });
    }
    p = p.then(function() { state.setupError = null; });
  } else if (state.binId) {
    p = readBin(state.binId).then(function(record) {
      if (!state.isEditingSomething) state.roster = record;
    });
  } else {
    p = Promise.resolve();
  }
  return p.catch(function() {
    if (isInitial) {
      state.setupError = "Couldn't connect to the shared list right now. Showing the built-in list instead — check-ins here won't be shared until this reconnects.";
      state.roster = SEED_ROSTER;
    }
  }).finally(function() {
    state.syncing = false;
    render();
  });
}

function persist(next) {
  state.roster = next;
  render();
  if (!state.binId) return;
  writeBin(state.binId, next).catch(function() {});
}

/* ===================== HELPERS ===================== */
function parseAssignmentLines(text) {
  return text.split("\n").map(function(l) { return l.trim(); }).filter(Boolean).map(function(line) {
    var idx = line.lastIndexOf(" @ ");
    if (idx === -1) return { title: line, time: "" };
    return { title: line.slice(0, idx).trim(), time: line.slice(idx + 3).trim() };
  });
}

function findDoubleBookings(assignments) {
  var byTime = {};
  assignments.forEach(function(a) {
    if (!a.time) return;
    if (!byTime[a.time]) byTime[a.time] = [];
    byTime[a.time].push(a.title);
  });
  return Object.keys(byTime).filter(function(t) { return byTime[t].length > 1; }).map(function(t) { return [t, byTime[t]]; });
}

/* ===================== ACTIONS ===================== */
function toggleCheckIn(id) {
  if (!state.roster) return;
  persist(state.roster.map(function(v) { return v.id === id ? Object.assign({}, v, { checkedIn: !v.checkedIn }) : v; }));
}

function startEdit(v) {
  state.editingId = v.id;
  state.editDraft = {
    name: v.name,
    assignmentsText: v.assignments.map(function(a) { return a.time ? a.title + " @ " + a.time : a.title; }).join("\n")
  };
  state.isEditingSomething = true;
  render();
}

function cancelEdit() {
  state.editingId = null;
  state.editDraft = { name: "", assignmentsText: "" };
  state.isEditingSomething = state.addOpen;
  render();
}

function saveEdit() {
  if (!state.roster) return;
  var trimmedName = state.editDraft.name.trim();
  if (!trimmedName) return;
  var assignments = parseAssignmentLines(state.editDraft.assignmentsText);
  var id = state.editingId;
  var next = state.roster.map(function(v) { return v.id === id ? Object.assign({}, v, { name: trimmedName, assignments: assignments }) : v; });
  cancelEdit();
  persist(next);
}

function deleteVolunteer(id) {
  if (!state.roster) return;
  var next = state.roster.filter(function(v) { return v.id !== id; });
  cancelEdit();
  persist(next);
}

function openAdd() {
  state.addDraft = { name: "", assignmentsText: "" };
  state.lastAdded = null;
  state.addOpen = true;
  state.isEditingSomething = true;
  render();
}

function cancelAdd() {
  state.addOpen = false;
  state.addDraft = { name: "", assignmentsText: "" };
  state.lastAdded = null;
  state.isEditingSomething = state.editingId !== null;
  render();
}

function saveAdd() {
  if (!state.roster) return;
  var trimmedName = state.addDraft.name.trim();
  if (!trimmedName) return;
  var assignments = parseAssignmentLines(state.addDraft.assignmentsText);
  var maxId = state.roster.reduce(function(m, v) { return Math.max(m, v.id); }, 0);
  var newId = maxId + 1;
  var next = state.roster.concat([{ id: newId, name: trimmedName, assignments: assignments, checkedIn: false }]);
  state.lastAdded = { id: newId, name: trimmedName };
  state.addDraft = { name: "", assignmentsText: "" };
  persist(next);
}

function undoLastAdd() {
  if (!state.roster || !state.lastAdded) return;
  var id = state.lastAdded.id;
  state.lastAdded = null;
  persist(state.roster.filter(function(v) { return v.id !== id; }));
}

function tryPin() {
  var code = state.pinInput.trim();
  if (code === PLANNER_PIN) {
    state.pinPromptOpen = false;
    state.mode = "planner";
  } else if (code === CHECKIN_PIN) {
    state.pinPromptOpen = false;
    state.mode = "checkin";
  } else {
    state.pinError = "That code isn't right. Try again.";
  }
  render();
}

function exitSpecialMode() {
  state.mode = "volunteer";
  state.editingId = null;
  state.addOpen = false;
  state.isEditingSomething = false;
  render();
}

function copyShareUrl() {
  navigator.clipboard.writeText(state.shareUrl).then(function() {
    state.copied = true;
    render();
    setTimeout(function() { state.copied = false; render(); }, 2000);
  }).catch(function() {});
}

/* ===================== RENDER ===================== */
function render() {
  var active = document.activeElement;
  var activeId = (active && active.id) ? active.id : null;
  var selStart = null, selEnd = null;
  if (activeId && typeof active.selectionStart === "number") {
    selStart = active.selectionStart;
    selEnd = active.selectionEnd;
  }
  var pageScrollY = window.scrollY;

  renderInner();

  if (activeId) {
    var el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
  window.scrollTo(0, pageScrollY);
}

function renderInner() {
  var app = document.getElementById("app");

  if (state.roster === null) {
    app.innerHTML = '<div class="loading-wrap"><div class="loading-inner">' + ICONS.refresh + '<span>Loading...</span></div></div>';
    return;
  }

  var isPlanner = state.mode === "planner";
  var isCheckin = state.mode === "checkin";

    if (state.filter === "in" && !v.checkedIn) return false;
    if (state.filter === "out" && v.checkedIn) return false;
    if (!q) return true;
    if (v.name.toLowerCase().indexOf(q) !== -1) return true;
    return v.assignments.some(function(a) { return a.title.toLowerCase().indexOf(q) !== -1; });
  }).sort(function(a, b) { return a.name.localeCompare(b.name); });

  html += '<div class="filters">';

      html += '<div class="add-panel"><div class="add-panel-head"><span>Add volunteer</span><button onclick="cancelAdd()">Cancel</button></div>';
      html += '<input type="text" id="addNameInput" placeholder="Full name" value="' + esc(state.addDraft.name) + '" oninput="onAddNameInput(this.value)">';
      html += '<textarea id="addAssignInput" rows="2" placeholder="Assignment (one per line)\ne.g. Lunch — Kitchen @ 2:30 PM – 3:30 PM" oninput="onAddAssignInput(this.value)">' + esc(state.addDraft.assignmentsText) + '</textarea>';
      var addBookings = findDoubleBookings(parseAssignmentLines(state.addDraft.assignmentsText));
      if (addBookings.length > 0) {
        html += '<div class="warn-box">';
        addBookings.forEach(function(b) { html += '<p>⚠ Double-booked at ' + esc(b[0]) + ': ' + esc(b[1].join(" and ")) + '</p>'; });
        html += '</div>';
      }
      html += '<button class="btn-primary with-icon" ' + (!state.addDraft.name.trim() ? 'disabled' : '') + ' onclick="saveAdd()">' + ICONS.plus + 'Add to roster</button>';
      if (state.lastAdded) {
        html += '<div class="undo-row"><span>Added ' + esc(state.lastAdded.name) + '.</span><button onclick="undoLastAdd()">Undo</button></div>';
      }
      html += '</div>';
    } else {
      html += '<button class="btn-primary with-icon" onclick="openAdd()">' + ICONS.plus + 'Add a volunteer</button>';
    }
    html += '</div></footer>';
  }

  app.innerHTML = html;
}

function renderRow(v, isPlanner, canCheckIn) {
  var circleClass = "circle" + (v.checkedIn ? " checked" : "");
  var circleInner = v.checkedIn ? ICONS.check : "";
  var rowClass = "row" + (canCheckIn ? " tappable" : "");
  var rowClick = canCheckIn ? ' onclick="toggleCheckIn(' + v.id + ')"' : "";

  var h = '<div class="' + rowClass + '"' + rowClick + '>';
  h += '<div class="' + circleClass + '">' + circleInner + '</div>';
  h += '<div class="person-info"><p class="person-name' + (v.checkedIn ? ' checked' : '') + '">' + esc(v.name) + '</p>';
  if (v.assignments.length > 0) {
    h += '<p class="person-assign">' + esc(v.assignments.map(function(a) { return a.time ? a.title + " (" + a.time + ")" : a.title; }).join(" · ")) + '</p>';
  } else {
    h += '<p class="person-assign empty">No assignment listed</p>';
  }
  h += '</div>';
  if (isPlanner) {
    h += '<button class="edit-btn" onclick="event.stopPropagation(); startEdit(' + JSON.stringify(v).replace(/"/g, "&quot;") + ')">' + ICONS.pencil + '</button>';
  }
  h += '</div>';
  return h;
}

function renderEditPanel(v) {
  var h = '<div class="edit-panel"><label>Name</label>';
  h += '<input type="text" id="editNameInput" value="' + esc(state.editDraft.name) + '" oninput="onEditNameInput(this.value)">';
  h += '<label>Assignments (one per line, "Title @ time" optional)</label>';
  h += '<textarea id="editAssignInput" rows="4" oninput="onEditAssignInput(this.value)">' + esc(state.editDraft.assignmentsText) + '</textarea>';
  var bookings = findDoubleBookings(parseAssignmentLines(state.editDraft.assignmentsText));
  if (bookings.length > 0) {
    h += '<div class="warn-box">';
    bookings.forEach(function(b) { h += '<p>⚠ Double-booked at ' + esc(b[0]) + ': ' + esc(b[1].join(" and ")) + '</p>'; });
    h += '</div>';
  }
  h += '<div class="edit-actions">';
  h += '<button class="remove-btn" onclick="deleteVolunteer(' + v.id + ')">' + ICONS.trash + 'Remove</button>';
  h += '<div class="btn-group"><button class="btn-secondary" onclick="cancelEdit()">Cancel</button><button class="btn-primary-sm" onclick="saveEdit()">Save</button></div>';
  h += '</div></div>';
  return h;
}

/* ===================== INPUT HANDLERS (preserve focus) ===================== */
function onSearchInput(val) { state.listQuery = val; render(); }
function onPinInput(val) { state.pinInput = val; state.pinError = ""; render(); }
function onAddNameInput(val) { state.addDraft.name = val; state.lastAdded = null; render(); }
function onAddAssignInput(val) { state.addDraft.assignmentsText = val; render(); }
function onEditNameInput(val) { state.editDraft.name = val; render(); }
function onEditAssignInput(val) { state.editDraft.assignmentsText = val; render(); }

function togglePinPrompt() {
  state.pinInput = "";
  state.pinError = "";
  state.pinPromptOpen = !state.pinPromptOpen;
  render();
}
function setFilter(f) { state.filter = f; render(); }

/* ===================== INIT ===================== */
loadFromStorage(true);
setInterval(function() { if (!state.isEditingSomething) loadFromStorage(false); }, 6000);
</script>
</body>
</html>
